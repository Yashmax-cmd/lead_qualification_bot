version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead_qualification_backend
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - MLFLOW_TRACKING_URI=sqlite:///mlruns.db
    networks:
      - lead_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lead_qualification_frontend
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_PORT=8501
      - API_URL=http://backend:8000/analyze
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lead_network
    restart: unless-stopped

networks:
  lead_network:
    driver: bridge
